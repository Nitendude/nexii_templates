<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nexii Tech AI Proposal Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useState } = React;
    const DEMO_MODE = true;
    const PUBLIC_SITE_URL = "https://n3xiisal3z-prop0z4l.vercel.app";
    const LOCAL_N8N_BASE_URL = "http://localhost:5670";
    const isLocalHost = ["localhost", "127.0.0.1"].includes(window.location.hostname);
    const APP_ENDPOINT = isLocalHost
      ? `${LOCAL_N8N_BASE_URL}/webhook/nexii-tech-proposal`
      : "/api/proposal";
    const STATS_ENDPOINT = isLocalHost
      ? `${LOCAL_N8N_BASE_URL}/webhook/nexii-tech-stats`
      : "/api/stats";
    const CLIENTS_ENDPOINT = isLocalHost
      ? "/clients.php"
      : "/api/clients";

    const iconPaths = {
      Send: <><path d="m22 2-7 20-4-9-9-4Z" /><path d="M22 2 11 13" /></>,
      Database: <><ellipse cx="12" cy="5" rx="9" ry="3" /><path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5" /><path d="M3 12c0 1.7 4 3 9 3s9-1.3 9-3" /></>,
      Sparkles: <><path d="m12 3-1.9 5.8L4 11l6.1 2.2L12 19l1.9-5.8L20 11l-6.1-2.2Z" /></>,
      Mail: <><rect width="20" height="16" x="2" y="4" rx="2" /><path d="m22 7-10 6L2 7" /></>,
      Copy: <><rect width="14" height="14" x="8" y="8" rx="2" /><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" /></>,
      Check: <path d="M20 6 9 17l-5-5" />,
      Settings: <><path d="M12.2 2h-.4a2 2 0 0 0-2 2v.2a2 2 0 0 1-1 1.7l-.4.2a2 2 0 0 1-2 0l-.2-.1a2 2 0 0 0-2.7.7l-.2.3a2 2 0 0 0 .7 2.7l.2.1a2 2 0 0 1 1 1.7v.5a2 2 0 0 1-1 1.7l-.2.1a2 2 0 0 0-.7 2.7l.2.3a2 2 0 0 0 2.7.7l.2-.1a2 2 0 0 1 2 0l.4.2a2 2 0 0 1 1 1.7v.2a2 2 0 0 0 2 2h.4a2 2 0 0 0 2-2v-.2a2 2 0 0 1 1-1.7l.4-.2a2 2 0 0 1 2 0l.2.1a2 2 0 0 0 2.7-.7l.2-.3a2 2 0 0 0-.7-2.7l-.2-.1a2 2 0 0 1-1-1.7v-.5a2 2 0 0 1 1-1.7l.2-.1a2 2 0 0 0 .7-2.7l-.2-.3a2 2 0 0 0-2.7-.7l-.2.1a2 2 0 0 1-2 0l-.4-.2a2 2 0 0 1-1-1.7V4a2 2 0 0 0-2-2Z" /><circle cx="12" cy="12" r="3" /></>,
      LayoutDashboard: <><rect width="7" height="9" x="3" y="3" rx="1" /><rect width="7" height="5" x="14" y="3" rx="1" /><rect width="7" height="9" x="14" y="12" rx="1" /><rect width="7" height="5" x="3" y="16" rx="1" /></>,
      Code: <><path d="m16 18 6-6-6-6" /><path d="m8 6-6 6 6 6" /></>,
      Bot: <><path d="M12 8V4H8" /><rect width="16" height="12" x="4" y="8" rx="2" /><path d="M2 14h2" /><path d="M20 14h2" /><path d="M15 13v2" /><path d="M9 13v2" /></>,
      UserCheck: <><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="m16 11 2 2 4-4" /></>
    };

    function Icon({ name, size = 16, className = "" }) {
      return (
        <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          {iconPaths[name]}
        </svg>
      );
    }

    const Card = ({ className, children }) => (
      <div className={`bg-white rounded-xl border border-gray-200 shadow-sm ${className || ""}`}>{children}</div>
    );

    const CardContent = ({ className, children }) => (
      <div className={`p-6 ${className || ""}`}>{children}</div>
    );

    const Button = ({ children, onClick, variant = "default", className = "", disabled = false, size = "default", title }) => {
      const baseStyle = "inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gray-950 disabled:pointer-events-none disabled:opacity-50";
      const variants = {
        default: "bg-black text-white hover:bg-gray-800",
        outline: "border border-gray-200 bg-white hover:bg-gray-100 hover:text-gray-900",
        ghost: "hover:bg-gray-100 hover:text-gray-900",
        secondary: "bg-gray-100 text-gray-900 hover:bg-gray-100/80"
      };
      const sizes = {
        default: "h-10 px-4 py-2",
        sm: "h-9 rounded-md px-3",
        lg: "h-11 rounded-md px-8",
        icon: "h-10 w-10"
      };

      return (
        <button onClick={onClick} disabled={disabled} title={title} className={`${baseStyle} ${variants[variant]} ${sizes[size]} ${className}`}>
          {children}
        </button>
      );
    };

    const Input = ({ value, onChange, placeholder, className = "", type = "text" }) => (
      <input type={type} value={value} onChange={onChange} placeholder={placeholder} className={`flex h-10 w-full rounded-md border border-gray-200 bg-white px-3 py-2 text-sm placeholder:text-gray-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gray-950 disabled:cursor-not-allowed disabled:opacity-50 ${className}`} />
    );

    const Label = ({ children, className = "" }) => (
      <label className={`text-sm font-medium leading-none ${className}`}>{children}</label>
    );

    const Textarea = ({ value, onChange, placeholder, className = "" }) => (
      <textarea value={value} onChange={onChange} placeholder={placeholder} className={`flex min-h-[80px] w-full rounded-md border border-gray-200 bg-white px-3 py-2 text-sm placeholder:text-gray-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gray-950 disabled:cursor-not-allowed disabled:opacity-50 ${className}`} />
    );

    const Badge = ({ children, className = "" }) => (
      <div className={`inline-flex items-center rounded-full border border-gray-200 px-2.5 py-0.5 text-xs font-semibold ${className}`}>{children}</div>
    );

    const CATEGORIES_DATA = {
      Core: ["Restaurant", "Real Estate", "Clinic", "E-commerce", "Construction", "Logistics", "Education", "Finance"],
      "Gov/Public": ["Government", "School", "University", "NGO", "Religious", "Community"],
      "Energy/Ind": ["Solar", "Manufacturing", "Warehousing", "Recycling", "Mining", "Oil & Gas"],
      "Food/Hosp": ["Fast Food", "Cafe", "Bar/Nightclub", "Hotel", "Catering", "Bakery", "Food Truck"],
      Health: ["Dental", "Pharmacy", "Gym/Fitness", "Spa/Salon", "Veterinary", "Hospital", "Therapy", "Chiro"],
      Retail: ["Clothing", "Grocery", "Jewelry", "Furniture", "Electronics", "Auto Dealer", "Convenience"],
      "Prof. Svcs": ["Law Firm", "Accounting", "Insurance", "Marketing", "Consulting", "Architecture", "Engineering"],
      Trades: ["Plumbing", "HVAC", "Landscaping", "Cleaning", "Moving", "Pest Control", "Electrician", "Roofing", "Painting"],
      Auto: ["Auto Repair", "Car Wash", "Parking", "Taxi/Rideshare", "Courier"],
      Leisure: ["Travel", "Events", "Photography", "Gaming", "Cinema", "Museum", "Library"]
    };

    const ALL_CATEGORIES = Object.values(CATEGORIES_DATA).flat();

    function createEmptyStats() {
      return ALL_CATEGORIES.reduce((accumulator, category) => {
        accumulator[category] = 0;
        return accumulator;
      }, {});
    }

    const N8N_WORKFLOW_JSON = {
      name: "Nexii Tech AI Proposal Automation",
      nodes: [
        {
          parameters: {
            path: "nexii-tech-proposal",
            responseMode: "onReceived",
            responseData: "firstEntryJson",
            responseCode: 200,
            responseBody: "={ success: true, message: \"Proposal automation started. Check MySQL and Telegram for completion.\" }",
            options: {
              allowedOrigins: "https://n3xiisal3z-prop0z4l.vercel.app"
            }
          },
          name: "Webhook",
          type: "n8n-nodes-base.webhook",
          typeVersion: 1,
          position: [250, 300],
          webhookId: "nexii-tech-proposal"
        },
        {
          parameters: {
            operation: "executeQuery",
            query: "INSERT INTO nexii_leads (email, company, category, notes, referrer, created_at) VALUES (?, ?, ?, ?, ?, ?) ON DUPLICATE KEY UPDATE category = VALUES(category), notes = VALUES(notes), referrer = VALUES(referrer), updated_at = CURRENT_TIMESTAMP",
            options: {
              queryReplacement: "={{ [$json.body.email, $json.body.company, $json.body.category, $json.body.notes, $json.body.referrer, $json.body.submittedAt || $now] }}"
            }
          },
          name: "MySQL Leads",
          type: "n8n-nodes-base.mySql",
          typeVersion: 4.4,
          position: [450, 300],
          credentials: { mySql: { id: "YOUR_MYSQL_CRED_ID", name: "MySQL account" } }
        },
        {
          parameters: {
            model: "gemini-1.5-flash-latest",
            prompt: "=You are a professional Sales Consultant from Nexii Tech Automations.\\n\\nWrite a concise, formal business outreach EMAIL BODY ONLY for a potential client.\\n\\nClient Information:\\n- Company Name: {{ $json.body.company }}\\n- Industry: {{ $json.body.category }}\\n- Website: {{ $json.body.website || 'Not provided' }}\\n- Business Needs / Admin Notes: {{ $json.body.notes || 'No notes provided' }}\\n\\nContext:\\nThis is cold outreach. The client did not contact us first.\\n\\nRules:\\n- Start exactly with: Dear {{ $json.body.company }},\\n- Use only the company name in the greeting.\\n- Do not include a subject line, markdown, placeholders, bullet points, or headings.\\n- Write only the email body.\\n- Use simple, clear business English.\\n- Avoid deep or fancy words such as bespoke, tailored, foster, empower, optimize, leverage, comprehensive, sophisticated, strategic, seamless, robust, maximize, and personalized.\\n- Prefer plain words like build, improve, fix, manage, help, and set up.\\n- Explicitly mention the business needs from the notes in paragraph 1.\\n- In paragraph 2, directly connect those needs to Nexii Tech services that solve them.\\n- If the notes mention booking, mention booking system or booking website improvements.\\n- If the notes mention website, mention website improvement or website redevelopment.\\n- If the notes mention marketing, translate that into services we actually offer such as website optimization, lead capture flows, CRM follow-up automation, inquiry handling, and conversion-focused automation. Do not claim we offer general marketing agency services.\\n- Do not write generic industry statements unless they support the specific notes.\\n\\nLength:\\n- Maximum 3 short paragraphs.\\n- Each paragraph must have 2 sentences only.\\n- Total length must be 110 to 150 words.\\n\\nContent:\\nParagraph 1: Introduce Nexii Tech Automations and reference the exact business needs from the notes.\\nParagraph 2: Explain how Nexii Tech can build or improve the client's system using only relevant services from website development, CRM or management systems, booking systems, inquiry handling, and automation solutions.\\nParagraph 3: Invite them to a short discussion or demo with a confident but non-pushy closing.\\n\\nEnd with:\\n\\nSincerely,\\nNexii Tech Automations",
            options: {}
          },
          name: "Gemini AI",
          type: "@n8n/n8n-nodes-langchain.lmChatGoogleGemini",
          typeVersion: 1,
          position: [650, 300],
          credentials: { googleGeminiApi: { id: "YOUR_GEMINI_CRED_ID", name: "Google Gemini API" } }
        },
        {
          parameters: {
            fromEmail: "proposals@nexiitech.com",
            toEmail: "={{ $json.body.email }}",
            subject: "=Proposal for {{ $json.body.company }} - Nexii Tech Automation",
            html: "=<h1>Proposal for {{ $json.body.company }}</h1><p>Hello,</p><p>Please find your custom automation proposal below:</p><hr>{{ $json.output }}<hr><p>Best regards,<br>Nexii Tech Team</p>",
            options: {}
          },
          name: "Send Telegram",
          type: "n8n-nodes-base.httpRequest",
          typeVersion: 4.2,
          position: [850, 300],
          credentials: {}
        }
      ],
      connections: {
        Webhook: { main: [[{ node: "MySQL Leads", type: "main", index: 0 }]] },
        "MySQL Leads": { main: [[{ node: "Gemini AI", type: "main", index: 0 }]] },
        "Gemini AI": { main: [[{ node: "Send Telegram", type: "main", index: 0 }]] }
      },
      pinData: {}
    };

    function NexiiTechAutomationPortal() {
      const [form, setForm] = useState({ email: "", category: "", company: "", website: "", notes: "", referrer: "" });
      const [loading, setLoading] = useState(false);
      const [result, setResult] = useState(null);
      const [previewContent, setPreviewContent] = useState("");
      const [activeRequest, setActiveRequest] = useState("send");
      const [copied, setCopied] = useState(false);
      const [draftCopied, setDraftCopied] = useState(false);
      const [stats, setStats] = useState(createEmptyStats);
      const [totalSent, setTotalSent] = useState(0);
      const [statsStatus, setStatsStatus] = useState("Connecting to live activity...");
      const [clients, setClients] = useState([]);
      const [clientsStatus, setClientsStatus] = useState("Loading MySQL client list...");
      const allCategories = ALL_CATEGORIES;
      const telegramDraft = previewContent
        ? [
            "NEXII TECH PROPOSAL",
            `Company: ${form.company || "-"}`,
            `Client Email: ${form.email || "-"}`,
            `Category: ${form.category || "-"}`,
            `Website: ${form.website || "-"}`,
            `Sales Owner: ${form.referrer || "-"}`,
            "",
            previewContent
          ].join("\n")
        : "";

      const demoClients = [
        {
          id: 1,
          company: "Santos Dental Clinic",
          email: "owner@santosdental.example",
          category: "Dental",
          referrer: "Maria Sales",
          latest_status: "draft sent",
          latest_event_type: "proposal_preview",
          last_activity_at: "May 12, 2026"
        },
        {
          id: 2,
          company: "Green Bowl Cafe",
          email: "hello@greenbowl.example",
          category: "Cafe",
          referrer: "APM Demo",
          latest_status: "tracked",
          latest_event_type: "lead_created",
          last_activity_at: "May 11, 2026"
        },
        {
          id: 3,
          company: "Mabuhay Realty Group",
          email: "sales@mabuhayrealty.example",
          category: "Real Estate",
          referrer: "Nexii Team",
          latest_status: "follow-up",
          latest_event_type: "telegram_draft",
          last_activity_at: "May 10, 2026"
        }
      ];

      const buildDemoProposal = (payload) => {
        const needText = payload.notes || "website improvement, inquiry handling, and client follow-up automation";
        return [
          `Dear ${payload.company || "Business Owner"},`,
          "",
          `Nexii Tech Automations helps businesses improve daily work through websites, CRM workflows, booking systems, inquiry handling, and automation. Based on your notes, the main opportunity is ${needText}.`,
          "",
          `For a ${payload.category} business, we can set up a clearer website flow, capture leads in one place, and create follow-up steps so your team can respond faster and manage requests with less manual work.`,
          "",
          "We would be glad to show a short demo and map the best setup for your team.",
          "",
          "Sincerely,",
          "Nexii Tech Automations"
        ].join("\n");
      };

      useEffect(() => {
        let cancelled = false;

        const loadStats = async () => {
          if (DEMO_MODE) {
            const nextCounts = createEmptyStats();
            nextCounts.Restaurant = 4;
            nextCounts["Real Estate"] = 3;
            nextCounts.Clinic = 5;
            nextCounts.Cafe = 2;
            nextCounts.Dental = 2;
            nextCounts.Logistics = 1;
            setStats(nextCounts);
            setTotalSent(17);
            setStatsStatus("Demo activity loaded from sample proposal history");
            return;
          }

          try {
            const response = await fetch(STATS_ENDPOINT, {
              method: "GET",
              cache: "no-store"
            });
            const data = await response.json().catch(() => ({}));

            if (!response.ok) {
              throw new Error(data.message || `Request failed with status ${response.status}`);
            }

            if (cancelled) {
              return;
            }

            const nextCounts = createEmptyStats();
            Object.entries(data.counts || {}).forEach(([category, count]) => {
              if (Object.prototype.hasOwnProperty.call(nextCounts, category)) {
                nextCounts[category] = Number(count) || 0;
              }
            });

            setStats(nextCounts);
            setTotalSent(Number(data.totalSent) || 0);
            setStatsStatus(data.message || (isLocalHost ? "Live activity connected to local n8n" : "Live activity connected"));
          } catch (error) {
            if (cancelled) {
              return;
            }

            setStats(createEmptyStats());
            setTotalSent(0);
            setStatsStatus(`Waiting for live stats: ${error.message}`);
          }
        };

        loadStats();
        const intervalId = window.setInterval(loadStats, 10000);

        return () => {
          cancelled = true;
          window.clearInterval(intervalId);
        };
      }, []);

      useEffect(() => {
        let cancelled = false;

        const loadClients = async () => {
          if (DEMO_MODE) {
            setClients(demoClients);
            setClientsStatus("Demo MySQL client list loaded");
            return;
          }

          try {
            const response = await fetch(CLIENTS_ENDPOINT, {
              method: "GET",
              cache: "no-store"
            });
            const data = await response.json().catch(() => ({}));

            if (!response.ok) {
              throw new Error(data.message || `Request failed with status ${response.status}`);
            }

            if (cancelled) {
              return;
            }

            setClients(Array.isArray(data.clients) ? data.clients : []);
            setClientsStatus(data.message || "Client monitor loaded");
          } catch (error) {
            if (cancelled) {
              return;
            }

            setClients([]);
            setClientsStatus(`Client monitor unavailable: ${error.message}`);
          }
        };

        loadClients();
        const intervalId = window.setInterval(loadClients, 10000);

        return () => {
          cancelled = true;
          window.clearInterval(intervalId);
        };
      }, []);

      const submitLead = async (mode = "send") => {
        if (!form.email || !form.category || !form.referrer) {
          alert("Please fill in Client Email, Category, and Sales Owner / Referrer");
          return;
        }

        setLoading(true);
        setActiveRequest(mode);
        setResult(null);

        try {
          const payload = {
            email: form.email,
            category: form.category,
            company: form.company,
            website: form.website,
            notes: form.notes,
            referrer: form.referrer,
            mode,
            source: "NEXII TECH AUTOMATION Website",
            submittedAt: new Date().toISOString()
          };

          if (DEMO_MODE) {
            await new Promise((resolve) => window.setTimeout(resolve, 450));
            const generated = buildDemoProposal(payload);
            setPreviewContent(generated);
            setTotalSent((current) => mode === "send" ? current + 1 : current);
            setStats((current) => ({
              ...current,
              [payload.category]: (current[payload.category] || 0) + 1
            }));
            setClients((current) => [
              {
                id: Date.now(),
                company: payload.company || "New Demo Lead",
                email: payload.email,
                category: payload.category,
                referrer: payload.referrer,
                latest_status: mode === "preview" ? "preview ready" : "telegram queued",
                latest_event_type: mode === "preview" ? "proposal_preview" : "telegram_send",
                last_activity_at: "Just now"
              },
              ...current
            ]);
            setClientsStatus("Demo client list updated");
            setResult({
              success: true,
              message: mode === "preview" ? "Demo Telegram draft generated." : "Demo proposal queued to Telegram.",
              data: { payload, proposalContent: generated }
            });
            setLoading(false);
            return;
          }

          const requestOptions = {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
          };

          const res = await fetch(APP_ENDPOINT, requestOptions);
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            throw new Error(data.message || `Request failed with status ${res.status}`);
          }

          const upstreamData = data.upstream || data;
          if (upstreamData.proposalContent) {
            setPreviewContent(upstreamData.proposalContent);
          }

          setResult({
            success: true,
            message: data.message || (mode === "preview"
              ? "Telegram draft generated successfully."
              : (isLocalHost ? "Proposal triggered successfully on local n8n!" : "Proposal triggered successfully!")),
            data
          });
        } catch (error) {
          setResult({ success: false, message: `Error: ${error.message}. Check console.` });
        }

        setLoading(false);
      };

      const copyToClipboard = () => {
        navigator.clipboard.writeText(JSON.stringify(N8N_WORKFLOW_JSON, null, 2));
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      const copyTelegramDraft = () => {
        if (!telegramDraft) {
          return;
        }
        navigator.clipboard.writeText(telegramDraft);
        setDraftCopied(true);
        setTimeout(() => setDraftCopied(false), 2000);
      };

      return (
        <div className="min-h-screen bg-gray-50 p-4 md:p-6 font-sans text-gray-900">
          <div className="max-w-[1600px] mx-auto grid lg:grid-cols-12 gap-4 min-h-[calc(100vh-48px)]">
            <div className="lg:col-span-7 flex flex-col h-full">
              <Card className="rounded-2xl shadow-xl border-0 ring-1 ring-gray-200 flex flex-col h-full overflow-hidden">
                <CardContent className="p-6 space-y-5 flex-1 overflow-y-auto">
                  <div className="space-y-4 border-b pb-4">
                    <div className="flex justify-between items-start gap-3">
                      <div>
                        <Badge className="mb-2 bg-blue-50 text-blue-700 border-blue-100">NEXII TECH AUTOMATION</Badge>
                        <h1 className="text-2xl font-bold tracking-tight">AI Proposal Portal</h1>
                        <p className="text-sm text-gray-500 mt-1">Sales reps use this page only. The automation and live activity both come from your private server through secure relay routes.</p>
                      </div>
                      <div className="flex flex-col items-end gap-2">
                        <a href="../../index.html#catalog" className="inline-flex h-9 items-center rounded-md border border-gray-200 bg-white px-3 text-xs font-semibold text-gray-700 shadow-sm hover:bg-gray-50">Demo Hub</a>
                        <Badge className="bg-emerald-50 text-emerald-700 border-emerald-100">{DEMO_MODE ? "Demo Mode Ready" : "Live Link Ready"}</Badge>
                      </div>
                    </div>
                  </div>

                  <div className="space-y-5">
                    <div className="rounded-xl border border-blue-100 bg-blue-50 p-3 text-xs text-blue-800">
                      {DEMO_MODE ? "Demo mode is active. Form actions generate sample drafts and update the dashboard without requiring private backend access." : <>Shared access link: <a href={PUBLIC_SITE_URL} className="font-semibold underline underline-offset-2">n3xiisal3z-prop0z4l.vercel.app</a></>}
                    </div>

                      <div className="grid md:grid-cols-2 gap-4">
                        <div className="space-y-1.5">
                          <Label>Client Email</Label>
                          <Input value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} placeholder="businessowner@company.com" />
                        </div>
                        <div className="space-y-1.5">
                          <Label>Company Name</Label>
                          <Input value={form.company} onChange={(e) => setForm({ ...form, company: e.target.value })} placeholder="Company Name" />
                        </div>
                      </div>

                      <div className="space-y-1.5">
                        <Label>Company Website</Label>
                        <Input value={form.website} onChange={(e) => setForm({ ...form, website: e.target.value })} placeholder="https://company.com" />
                      </div>

                      <div className="space-y-1.5 bg-yellow-50 p-3 rounded-lg border border-yellow-100">
                        <Label className="text-yellow-800 flex items-center gap-2 text-xs">
                          <Icon name="UserCheck" size={12} className="w-3 h-3" />
                          Sales Owner / Referrer
                        </Label>
                        <Input value={form.referrer} onChange={(e) => setForm({ ...form, referrer: e.target.value })} placeholder="Enter the salesperson name or owner ID" className="bg-white border-yellow-200 focus-visible:ring-yellow-500 h-9 text-xs" />
                        <p className="text-[10px] text-yellow-700">* Required. This becomes the owner of the lead in MySQL. Other sales users will be blocked from re-sending the same client.</p>
                      </div>

                      <div className="space-y-2">
                        <Label>Category of Business</Label>
                        <div className="grid grid-cols-2 md:grid-cols-3 gap-x-4 gap-y-3">
                          {Object.entries(CATEGORIES_DATA).map(([group, items]) => (
                            <div key={group} className="space-y-1.5">
                              <h4 className="text-[10px] font-bold text-gray-400 uppercase tracking-wider border-b border-gray-100 pb-1 mb-1">{group}</h4>
                              <div className="grid grid-cols-2 gap-1.5">
                                {items.map((item) => (
                                  <Button key={item} variant={form.category === item ? "default" : "outline"} onClick={() => setForm({ ...form, category: item })} className="text-[10px] justify-center h-7 px-1 whitespace-nowrap overflow-hidden text-ellipsis" title={item}>
                                    {item}
                                  </Button>
                                ))}
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>

                      <div className="space-y-1.5">
                        <Label>Business Needs / Notes</Label>
                        <Textarea value={form.notes} onChange={(e) => setForm({ ...form, notes: e.target.value })} placeholder="Internal sales observation only. Example: No website yet, may need online ordering or booking improvements." className="min-h-[70px]" />
                        <p className="text-[10px] text-gray-500">These notes are internal sales input. The email will frame them as a question or an offer, not as a confirmed client request.</p>
                      </div>

                      <div className="rounded-xl border border-gray-200 bg-gray-50 p-3 text-xs text-gray-600">
                        <p className="font-semibold text-gray-800">Automation Route</p>
                        <p className="mt-1 font-mono">{DEMO_MODE ? "Static demo route - no private webhook required" : APP_ENDPOINT}</p>
                        <p className="mt-1">
                          {DEMO_MODE
                            ? "This publishable demo simulates the n8n, MySQL, Gemini, and Telegram handoff for client presentations."
                            : isLocalHost
                            ? "Local mode is active. This page sends requests directly to your local n8n instance."
                            : "This page sends requests to Vercel, and Vercel forwards them to your private n8n webhook."}
                        </p>
                        <p className="mt-1">
                          {DEMO_MODE
                            ? <>Demo route: <span className="font-mono">proposal-preview -&gt; activity -&gt; client monitor</span></>
                            : isLocalHost
                            ? <>Local n8n route: <span className="font-mono">{APP_ENDPOINT}</span></>
                            : <>Live activity uses <span className="font-mono">{STATS_ENDPOINT}</span> the same way.</>}
                        </p>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-2 gap-3 pt-1">
                        <Button className="w-full h-10 text-sm font-semibold shadow-md" variant="outline" onClick={() => submitLead("preview")} disabled={loading}>
                          {loading && activeRequest === "preview" ? "Generating Draft..." : <span className="flex items-center gap-2"><Icon name="Sparkles" size={14} /> Preview Telegram Draft</span>}
                        </Button>
                        <Button className="w-full h-10 text-sm font-semibold shadow-md" onClick={() => submitLead("send")} disabled={loading}>
                          {loading && activeRequest === "send" ? "Sending..." : <span className="flex items-center gap-2"><Icon name="Send" size={14} /> Send To Telegram</span>}
                        </Button>
                      </div>

                      {result && (
                        <div className={`rounded-xl border p-3 text-xs overflow-hidden ${result.success ? "bg-green-50 border-green-200 text-green-800" : "bg-red-50 border-red-200 text-red-800"}`}>
                          <strong>{result.success ? "Success:" : "Error:"}</strong> {result.message}
                        </div>
                      )}

                      {previewContent && (
                        <div className="rounded-xl border border-gray-200 bg-white p-4">
                          <div className="flex items-center justify-between gap-3 mb-3">
                            <div>
                              <p className="text-sm font-semibold text-gray-900">Telegram Message Preview</p>
                              <p className="text-[10px] text-gray-500">This is the message the sender can copy and paste from Telegram.</p>
                            </div>
                            <div className="flex items-center gap-2">
                              <Button size="sm" variant="secondary" onClick={copyTelegramDraft} className="bg-white shadow-sm border border-gray-200">
                                {draftCopied ? <Icon name="Check" size={14} className="mr-1 text-green-600" /> : <Icon name="Copy" size={14} className="mr-1" />}
                                {draftCopied ? "Copied!" : "Copy Draft"}
                              </Button>
                              <Badge className="bg-slate-50 text-slate-700 border-slate-200">Preview Ready</Badge>
                            </div>
                          </div>
                          <div className="rounded-lg border border-blue-200 bg-blue-50 p-3 text-xs text-blue-900 whitespace-pre-wrap leading-5 mb-3">
                            {telegramDraft}
                          </div>
                          <div className="rounded-lg border border-gray-200 bg-gray-50 p-4 text-sm text-gray-800 whitespace-pre-wrap leading-6">
                            {previewContent}
                          </div>
                        </div>
                      )}
                  </div>
                </CardContent>
              </Card>
            </div>

            <div className="lg:col-span-5 flex flex-col gap-4 h-full">
              <Card className="rounded-2xl shadow-lg border-0 ring-1 ring-gray-200 overflow-hidden flex flex-col flex-1">
                <div className="bg-gray-900 p-3 text-white flex justify-between items-center shrink-0">
                  <div>
                    <h3 className="font-semibold flex items-center gap-2 text-sm"><Icon name="Sparkles" size={16} className="text-green-400" /> Today's Activity</h3>
                    <p className="text-[10px] text-gray-400">{statsStatus}</p>
                  </div>
                  <div className="text-right">
                    <div className="text-xl font-bold font-mono leading-none">{totalSent}</div>
                    <div className="text-[9px] text-gray-400 uppercase tracking-wider">Total Sent</div>
                  </div>
                </div>

                <div className="p-3 bg-white flex-1 overflow-hidden flex flex-col">
                  <div className="grid grid-cols-4 sm:grid-cols-5 md:grid-cols-6 lg:grid-cols-5 xl:grid-cols-6 gap-2 overflow-y-auto pr-1">
                    {allCategories.map((cat) => {
                      const count = stats[cat] || 0;
                      const hasActivity = count > 0;
                      return (
                        <div key={cat} className={`flex flex-col items-center justify-center p-1.5 rounded-md border text-center transition-all ${hasActivity ? "bg-green-50 border-green-100 shadow-sm" : "bg-gray-50 border-gray-100 opacity-60 grayscale"}`}>
                          <span className={`text-base font-bold font-mono leading-none mb-0.5 ${hasActivity ? "text-green-700" : "text-gray-400"}`}>{count}</span>
                          <span className="text-[9px] font-medium text-gray-600 truncate w-full px-0.5" title={cat}>{cat}</span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </Card>

              <Card className="rounded-2xl shadow-lg border-0 ring-1 ring-gray-200 overflow-hidden flex flex-col flex-1">
                <div className="bg-white p-3 border-b border-gray-200 shrink-0">
                  <h3 className="font-semibold flex items-center gap-2 text-sm text-gray-900"><Icon name="Database" size={16} className="text-blue-600" /> Existing Clients</h3>
                  <p className="text-[10px] text-gray-500 mt-1">{clientsStatus}</p>
                </div>
                <div className="p-3 bg-white flex-1 overflow-auto">
                  {clients.length === 0 ? (
                    <div className="rounded-lg border border-dashed border-gray-200 bg-gray-50 p-4 text-xs text-gray-500">
                      No clients in MySQL yet.
                    </div>
                  ) : (
                    <div className="space-y-2">
                      {clients.map((client) => (
                        <div key={`${client.id}-${client.email}`} className="rounded-lg border border-gray-200 bg-gray-50 p-3">
                          <div className="flex items-start justify-between gap-3">
                            <div className="min-w-0">
                              <p className="text-sm font-semibold text-gray-900 truncate">{client.company || "Unknown Company"}</p>
                              <p className="text-[11px] text-gray-600 truncate">{client.email || "-"}</p>
                            </div>
                            <Badge className="bg-white text-slate-700 border-slate-200">{client.latest_status || client.ownership_status || "tracked"}</Badge>
                          </div>
                          <div className="grid grid-cols-2 gap-2 mt-3 text-[10px] text-gray-600">
                            <div><span className="font-semibold text-gray-800">Category:</span> {client.category || "-"}</div>
                            <div><span className="font-semibold text-gray-800">Owner:</span> {client.referrer || "-"}</div>
                            <div><span className="font-semibold text-gray-800">Last Event:</span> {client.latest_event_type || "-"}</div>
                            <div><span className="font-semibold text-gray-800">Last Activity:</span> {client.last_activity_at || client.updated_at || client.created_at || "-"}</div>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </Card>

              <Card className="rounded-2xl shadow-lg border-0 ring-1 ring-gray-200 shrink-0">
                <CardContent className="p-4">
                  <div className="grid grid-cols-3 gap-4">
                    <div className="flex items-start gap-2">
                      <div className="p-1.5 bg-blue-50 rounded text-blue-600 shrink-0"><Icon name="Database" size={16} /></div>
                      <div><h3 className="font-semibold text-gray-900 text-xs">MySQL</h3><p className="text-[10px] text-gray-500 mt-0.5">Stores lead, sender, and message history privately.</p></div>
                    </div>
                    <div className="flex items-start gap-2">
                      <div className="p-1.5 bg-purple-50 rounded text-purple-600 shrink-0"><Icon name="Sparkles" size={16} /></div>
                      <div><h3 className="font-semibold text-gray-900 text-xs">Gemini AI</h3><p className="text-[10px] text-gray-500 mt-0.5">Generates proposal. <span className="text-red-400 italic">Ignores referrer.</span></p></div>
                    </div>
                    <div className="flex items-start gap-2">
                      <div className="p-1.5 bg-green-50 rounded text-green-600 shrink-0"><Icon name="Send" size={16} /></div>
                      <div><h3 className="font-semibold text-gray-900 text-xs">Telegram Draft</h3><p className="text-[10px] text-gray-500 mt-0.5">Sender receives a ready-to-copy message.</p></div>
                    </div>
                  </div>
                </CardContent>
              </Card>

              <Card className="rounded-2xl shadow-lg border-0 ring-1 ring-gray-200 overflow-hidden shrink-0">
                <CardContent className="p-3">
                  <div className="grid grid-cols-2 gap-3 text-[10px] font-mono mb-3">
                    <div className="bg-blue-50 p-2 rounded border border-blue-100 text-blue-800">
                      <strong className="block mb-1 text-blue-900 text-xs">From Sales Link:</strong>
                      email, category, company, notes
                    </div>
                    <div className="bg-yellow-50 p-2 rounded border border-yellow-100 text-yellow-800">
                      <strong className="block mb-1 text-yellow-900 text-xs">Tracked on Server:</strong>
                      all above + <span className="font-bold bg-yellow-200 px-1 rounded">referrer</span>
                    </div>
                  </div>
                  <div className="relative group">
                    <div className="absolute right-2 top-2 z-10">
                      <Button size="sm" variant="secondary" onClick={copyToClipboard} className="bg-white shadow-sm border border-gray-200">
                        {copied ? <Icon name="Check" size={14} className="mr-1 text-green-600" /> : <Icon name="Copy" size={14} className="mr-1" />}
                        {copied ? "Copied!" : "Copy Workflow JSON"}
                      </Button>
                    </div>
                    <pre className="bg-gray-900 text-gray-300 p-4 rounded-xl text-xs overflow-auto max-h-[260px] font-mono border border-gray-700">
                      {JSON.stringify(N8N_WORKFLOW_JSON, null, 2)}
                    </pre>
                  </div>
                </CardContent>
              </Card>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<NexiiTechAutomationPortal />);
  </script>
</body>
</html>
