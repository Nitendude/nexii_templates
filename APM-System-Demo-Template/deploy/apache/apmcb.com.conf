<VirtualHost *:80>
    ServerName apmcb.com
    ServerAlias www.apmcb.com
    DocumentRoot /home/apmserver/Desktop/APM-System/public

    <Directory /home/apmserver/Desktop/APM-System/public>
        AllowOverride All
        Require all granted
        Options Indexes FollowSymLinks
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/apmcb_error.log
    CustomLog ${APACHE_LOG_DIR}/apmcb_access.log combined
</VirtualHost>
